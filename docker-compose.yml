version: '3.8'

services:
  chklst:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: chklst-app
    ports:
      - "8000:8000"
    volumes:
      # Persist data between container restarts
      - ./data:/app/data
      - ./reports:/app/reports
      - ./projects:/app/projects
      - ./library.json:/app/library.json
      - ./settings.json:/app/settings.json
    environment:
      - PYTHONUNBUFFERED=1
      - DEBUG=false
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  # Optional: Nginx reverse proxy for production
  nginx:
    image: nginx:alpine
    container_name: chklst-nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./docker/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./docker/ssl:/etc/nginx/ssl:ro
    depends_on:
      - chklst
    restart: unless-stopped
    profiles:
      - production
